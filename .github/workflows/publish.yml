name: 发布到 PyPI

on:
  # 可在 GitHub Actions 页面手动运行，也会在发布 GitHub Release 后自动运行。
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: 构建分发包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 构建包
        run: |
          python -m pip install --upgrade build
          python -m build

      # 将构建产物传给独立的发布任务，避免发布任务拥有源码写入权限。
      - name: 保存分发包
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: 发布 Python 分发包到 PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      # PyPI Trusted Publisher 必需：用于从 GitHub 获取 OIDC 身份令牌。
      id-token: write
    steps:
      - name: 下载分发包
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      # 不使用长期 API Token；PyPI 会通过 OIDC 签发短期上传凭据。
      - name: 发布分发包到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
