[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbpl"
version = "0.1.1"
description = "检测正在运行的 Python 脚本，并按地区打开对应视频。"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "hekuo5310"}]
dependencies = [
  "psutil>=5.9",
  "requests>=2.28",
]

[project.scripts]
nbpl = "nbpl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["sitecustomize"]
