[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbpl"
version = "0.1.0"
description = "Open a region-specific video when another Python script is running."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "hekuo5310"}]
dependencies = [
  "psutil>=5.9",
  "requests>=2.28",
]

[project.scripts]
nbpl = "nbpl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
